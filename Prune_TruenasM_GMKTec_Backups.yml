---
- name: Prune TruenasM GMKTec backups
  hosts: truenas-main
  become: true
  gather_facts: false

  vars:
    # alternate [new] path
    #backup_path: "/mnt/TrueNASPool1/LaptopBackup/GMKTecG3Plus_Win11_Jo"
    # path after migration to BigPool
    backup_path: "/mnt/BigPool/LaptopBackup/GMKTecG3Plus_Win11_Jo"
    show_debug: true
    
    # DRY-RUN SAFETY SWITCH
    dry_run: true 

  tasks:
    - name: Run backup pruning process with error handling
      block:
        - name: Print Dry-Run warning banner
          ansible.builtin.debug:
            msg: "⚠️ DRY RUN IS ENABLED! No files will actually be deleted. Set 'dry_run: false' to apply changes."
          when: dry_run | bool

        # NEW CHECK: Verify the path exists and is a directory
        - name: Verify backup directory exists
          ansible.builtin.stat:
            path: "{{ backup_path }}"
          register: path_status

        - name: Fail explicitly if path is missing or not a directory
          ansible.builtin.fail:
            msg: "The target path '{{ backup_path }}' does not exist or is not a directory!"
          when: not path_status.stat.exists or not path_status.stat.isdir

        # This will now only run if the path is confirmed valid
        - name: Find all files in the backup directory
          ansible.builtin.find:
            paths: "{{ backup_path }}"
            file_type: file
          register: found_files

        - name: Display total files found
          ansible.builtin.debug:
            msg: "Found {{ found_files.files | length }} files total in {{ backup_path }}"
          when: (show_debug | default(false)) | bool

        - name: Simulate file deletion (Dry Run)
          ansible.builtin.debug:
            msg: "WOULD DELETE OLD FILE: {{ item.path }} (Modified: {{ item.mtime }})"
          loop: "{{ (found_files.files | sort(attribute='mtime', reverse=true))[15:] }}"
          when: 
            - dry_run | bool
            - found_files.files | length > 15

        - name: Sort and remove files older than the newest 15 (Active Execution)
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ (found_files.files | sort(attribute='mtime', reverse=true))[15:] }}"
          when: 
            - not (dry_run | bool)
            - found_files.files | length > 15

      rescue:
        - name: Send Discord message on failure
          ansible.builtin.uri:
            url: "{{ discord_webhook }}"
            method: POST
            body_format: json
            body: 
              content: "❌ **Prune Backups Failed!**\n**Host:** {{ inventory_hostname }}\n**Target Path:** `{{ backup_path }}`\n**Dry Run Mode:** `{{ dry_run }}`\n**Error Details:** {{ ansible_failed_result.msg | default('An unknown error occurred.') }}"
            headers:
              Content-Type: application/json
            status_code: 204
          ignore_errors: true

        - name: Force playbook failure after notification
          ansible.builtin.fail:
            msg: "The pruning playbook failed. Discord notification has been sent."
